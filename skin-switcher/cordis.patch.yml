# dsh-skin-switcher bundle patch: inserts its public dsh.client entry and the
# host half (web routes) into the web plugin roster. The switcher is not a
# skin: it has no `ui-skin-*` row, is never part of the skin exclusivity
# patch rows, and must stay enabled whenever the GUI is up.
- insert:
    - id: dsh-skin-switcher
      name: '@dsh-external/dsh-client-ui-skin-switcher'
